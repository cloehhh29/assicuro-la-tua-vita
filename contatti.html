<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contatta Assicuro la tua vita per informazioni sulle possibilità di protezione assicurativa.">
<title>Contatti - Assicuro la tua vita</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7fc;
  color: #243247;
  line-height: 1.6;
}

header {
  background: #174ea6;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin-top: 0;
}

main {
  max-width: 650px;
  margin: 25px auto;
  padding: 20px;
}

section {
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
}

h2 {
  color: #174ea6;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #b9c7dc;
  border-radius: 6px;
  font-size: 16px;
  background: white;
}

.privacy {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 18px;
  font-weight: normal;
}

.privacy input {
  width: auto;
  margin-top: 5px;
  flex-shrink: 0;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: none;
  border-radius: 7px;
  background: #174ea6;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #12366f;
}

#risultato {
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  background: #edf4ff;
}

footer {
  text-align: center;
  padding: 15px;
  color: #526176;
}

.indietro {
  display: inline-block;
  margin-top: 18px;
  color: #174ea6;
  font-weight: bold;
  text-decoration: none;
}

.indietro:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  main {
    padding: 12px;
  }

  section {
    padding: 18px;
  }
}
</style>
</head>

<body>
<header>
  <h1>Assicuro la tua vita</h1>
  <p>La tua protezione, al centro.</p>
</header>

<main>
  <section>
    <h2>Richiedi informazioni</h2>

    <p>
      Compila il modulo per indicarci
      l'argomento che desideri approfondire.
    </p>

    <form id="modulo">
      <label for="nome">Nome</label>
      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Il tuo nome"
        autocomplete="name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="nome@esempio.it"
        autocomplete="email"
        required
      >

      <label for="servizio">Argomento di interesse</label>
      <select id="servizio" name="servizio" required>
        <option value="vita">Protezione personale</option>
        <option value="famiglia">Protezione della famiglia</option>
        <option value="consulenza">Consulenza generale</option>
      </select>

      <label class="privacy" for="privacy">
        <input
          type="checkbox"
          id="privacy"
          name="privacy"
          required
        >
        <span>
          Confermo di aver letto l'informativa sulla privacy.
          <strong>Prima di pubblicare, inserisci qui il collegamento alla tua informativa privacy reale.</strong>
        </span>
      </label>

      <button type="submit">Verifica la richiesta</button>
    </form>

    <div id="risultato" hidden aria-live="polite"></div>

    <a class="indietro" href="index.html">
      ← Torna alla pagina principale
    </a>
  </section>
</main>

<footer>
  <p>&copy; 2026 Assicuro la tua vita</p>
</footer>

<script>
const modulo = document.getElementById("modulo");
const nome = document.getElementById("nome");
const servizio = document.getElementById("servizio");
const risultato = document.getElementById("risultato");

modulo.addEventListener("submit", function(event) {
  event.preventDefault();

  const nomeUtente = nome.value.trim();
  const scelta = servizio.value;

  let descrizione = "";

  if (scelta === "vita") {
    descrizione = "protezione personale";
  } else if (scelta === "famiglia") {
    descrizione = "protezione della famiglia";
  } else {
    descrizione = "consulenza generale";
  }

  risultato.textContent =
    "Ciao, " + nomeUtente +
    "! Il modulo è stato compilato correttamente. " +
    "Argomento scelto: " + descrizione +
    ". Questa è una simulazione: la richiesta non è stata inviata.";

  risultato.hidden = false;
});
</script>
</body>
</html>
